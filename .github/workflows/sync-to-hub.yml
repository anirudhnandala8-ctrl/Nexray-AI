name: Sync to Hugging Face Hub
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # This version uses the official HF login method to avoid errors
          git remote add huggingface https://Anirudh-22:$HF_TOKEN@huggingface.co/Anirudh-22/Nexray-AI
          git push --force huggingface main:main
